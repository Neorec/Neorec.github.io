<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo PlayStudio</title>
<meta name="description" content="Neo PlayStudio makes cozy mobile games, including Sort Squishies.">
<style>
  :root { --ink: #3b2b5a; --pink: #ff6fa8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: linear-gradient(135deg, #ffd6e8, #d9e4ff); color: var(--ink);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .card { background: rgba(255, 255, 255, .85); border-radius: 28px; padding: 32px 24px; max-width: 460px; width: 100%;
          box-shadow: 0 8px 30px rgba(59, 43, 90, .12); }
  h1 { margin: 0; font-size: 34px; font-weight: 900; }
  .tag { margin: 4px 0 24px; opacity: .75; }
  h2 { margin: 0 0 4px; font-size: 26px; font-weight: 900; }
  h2 span { color: var(--pink); }
  p { margin: 0 0 16px; }
  a.btn { display: block; margin: 10px auto; padding: 12px; border-radius: 999px; background: #fff; color: var(--ink);
          font-weight: 800; text-decoration: none; border: 2px solid #f3d6e4; }
  a.btn:hover { border-color: var(--pink); }
  footer { margin-top: 20px; font-size: 14px; opacity: .7; }
  footer a { color: inherit; }
</style>
</head>
<body>
  <main class="card">
    <h1>Neo PlayStudio</h1>
    <p class="tag">Cozy games, made in British Columbia, Canada</p>
    <h2>Sort <span>Squishies</span></h2>
    <p>A cozy squishy sorting puzzle for Android.</p>
    <a class="btn" href="sort-squishies/privacy-policy.html">Privacy Policy</a>
    <a class="btn" href="sort-squishies/terms.html">Terms of Service</a>
    <footer>Contact: <a href="mailto:powderhornet@hotmail.com">powderhornet@hotmail.com</a></footer>
  </main>
</body>
</html>
